[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "necrogit"
version = "0.1.0"
description = "Commune with dead code and resurrect abandoned repositories with local AI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "gitpython>=3.1.40",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "sentry-sdk>=2.0.0"
]

[project.scripts]
necrogit = "necrogit.cli:cli"

[tool.setuptools.packages.find]
include = ["necrogit*"]
